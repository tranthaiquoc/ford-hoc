<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toán của Ford</title>
<style>
:root{--bg:#FFF8EC;--ink:#2B2D42;--muted:#6B6F80;--sh:0 6px 0 rgba(0,0,0,.08),0 10px 24px rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 40px}
.back{display:inline-block;background:#fff;border-radius:16px;padding:10px 16px;font-weight:800;text-decoration:none;color:inherit;box-shadow:var(--sh);margin-bottom:14px}
.hero{background:linear-gradient(135deg,#3A86FF,#8A5CF6);color:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:var(--sh)}
.hero .e{font-size:56px}
.hero h1{margin:6px 0 4px;font-size:30px}
.hero p{margin:0;font-weight:600}
h2{margin:24px 4px 10px;font-size:20px;color:var(--muted)}
a.u{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:var(--sh);border-left:8px solid var(--c)}
a.u:active,.back:active{transform:translateY(3px)}
a.u .e{font-size:40px}
a.u b{display:block;font-size:20px}
a.u small{color:var(--muted);font-weight:600;font-size:15px}
a.u .go{margin-left:auto;font-size:26px}
.new{background:#F2545B;color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:800;margin-left:6px;vertical-align:middle}
.soon{opacity:.5;pointer-events:none}
.prog{display:block;height:8px;border-radius:99px;background:#F1E4CC;margin-top:6px;overflow:hidden;max-width:220px}
.prog i{display:block;height:100%;background:#2EBD6B}
</style>
</head>
<body>
<main>
  <a class="back" href="../index.html">🏡 Trang chủ</a>
  <section class="hero">
    <div class="e">🧮</div>
    <h1>Toán của Ford</h1>
    <p>Tự làm trước, bí thì bấm Gợi ý nhé!</p>
  </section>

  <!-- Tháng mới thêm lên đầu. Tên file: nguồn-tháng-phần.html -->
  <h2>Thầy Khen - Tháng 11</h2>
  <a class="u" style="--c:#3A86FF" href="khen-t11-p1.html">
    <span class="e">✏️</span>
    <span><b>Khảo sát Phần 1 <span class="new">MỚI</span></b><small>14 câu + chọn số chia hết</small><span class="prog"><i data-key="ford_toan_p1_v1" data-total="20" style="width:0"></i></span></span>
    <span class="go">▶</span>
  </a>
  <a class="u soon" style="--c:#8A5CF6" href="#">
    <span class="e">📐</span>
    <span><b>Khảo sát Phần 2</b><small>Sắp có: trung bình cộng, tổng - hiệu, chu vi</small></span>
    <span class="go">⏳</span>
  </a>
</main>
<script>
document.querySelectorAll('.prog i[data-key]').forEach(el => {
  try {
    const s = JSON.parse(localStorage.getItem(el.dataset.key)); if (!s) return;
    let d = 0;
    for (const k in s.q || {}) if (s.q[k].st && s.q[k].st !== 'try') d++;
    for (const k in s.p2 || {}) if (s.p2[k] && s.p2[k].ok) d++;
    el.style.width = Math.min(100, Math.round(d / +el.dataset.total * 100)) + '%';
  } catch (e) {}
});
</script>
</body>
</html>
